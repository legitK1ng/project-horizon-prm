<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Horizon PRM — Kanban</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2230; --border:#30363d;
    --txt:#e6edf3; --muted:#8b949e; --accent:#58a6ff; --accent2:#3fb950;
    --hi:#f85149; --med:#d29922; --lo:#56d364;
    --backlog:#8b949e; --todo:#58a6ff; --prog:#d29922; --blocked:#f85149; --done:#3fb950;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--txt);font:14px/1.4 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--panel)}
  header h1{font-size:16px;margin:0;font-weight:600}
  .stats{color:var(--muted);font-size:12px;display:flex;gap:10px}
  .controls{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  input,select,button,textarea{font:inherit;color:var(--txt);background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:6px 8px}
  button{cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);color:#08111f;border-color:var(--accent);font-weight:600}
  #board{display:flex;gap:12px;padding:12px;overflow-x:auto;height:calc(100% - 56px);align-items:flex-start}
  .col{flex:0 0 280px;background:var(--panel);border:1px solid var(--border);border-radius:8px;display:flex;flex-direction:column;max-height:100%}
  .col-head{padding:8px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;font-weight:600}
  .col-head .dot{width:10px;height:10px;border-radius:50%}
  .col-head .count{margin-left:auto;color:var(--muted);font-size:12px}
  .col-body{padding:8px;overflow-y:auto;flex:1;min-height:60px}
  .col-body.dragover{background:var(--panel2);outline:2px dashed var(--accent);outline-offset:-4px}
  .card{background:var(--panel2);border:1px solid var(--border);border-left:3px solid var(--muted);border-radius:6px;padding:8px;margin-bottom:8px;cursor:grab}
  .card:active{cursor:grabbing}
  .card .title{margin:0 0 6px}
  .card .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11px}
  .badge{padding:1px 6px;border-radius:10px;border:1px solid var(--border);color:var(--muted)}
  .pri-High{color:var(--hi);border-color:var(--hi)} .pri-Medium{color:var(--med);border-color:var(--med)} .pri-Low{color:var(--lo);border-color:var(--lo)}
  .cat{color:var(--accent)}
  .src{color:var(--muted);font-size:10px;margin-top:4px;word-break:break-all}
  .card .note{color:var(--muted);font-size:11px;margin-top:4px;font-style:italic}
  .card .del{float:right;color:var(--muted);border:none;background:none;padding:0;font-size:14px;line-height:1}
  .card .del:hover{color:var(--hi)}
  .c-Backlog{border-left-color:var(--backlog)} .c-ToDo{border-left-color:var(--todo)}
  .c-InProgress{border-left-color:var(--prog)} .c-Blocked{border-left-color:var(--blocked)} .c-Done{border-left-color:var(--done)}
  .add-card{width:100%;margin-top:4px;background:transparent;border:1px dashed var(--border);color:var(--muted)}
  .add-card:hover{border-color:var(--accent);color:var(--txt)}
  /* modal */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:50}
  .modal-bg.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;width:420px;max-width:92vw;display:flex;flex-direction:column;gap:10px}
  .modal label{font-size:12px;color:var(--muted)}
  .modal textarea{min-height:70px;resize:vertical}
  .row{display:flex;gap:8px}
  .row>*{flex:1}
  .modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
  .hidden{display:none!important}
</style>
</head>
<body>
<header>
  <h1>Horizon PRM — Kanban</h1>
  <div class="stats" id="stats"></div>
  <div class="controls">
    <input id="search" placeholder="search…" style="width:150px"/>
    <select id="filterCat"><option value="">all categories</option></select>
    <button id="resetBtn">Reset to seed</button>
    <button class="primary" id="addBtn">+ Add card</button>
  </div>
</header>
<div id="board"></div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <label>Title</label>
    <textarea id="mTitle"></textarea>
    <div class="row">
      <div><label>Column</label><select id="mCol"></select></div>
      <div><label>Category</label><input id="mCat" list="catList"/></div>
    </div>
    <div class="row">
      <div><label>Priority</label><select id="mPri"><option>High</option><option>Medium</option><option>Low</option></select></div>
      <div><label>Source (ref)</label><input id="mSrc" placeholder="file:line"/></div>
    </div>
    <label>Note</label>
    <textarea id="mNote" style="min-height:50px"></textarea>
    <datalist id="catList"></datalist>
    <div class="actions">
      <button id="mCancel">Cancel</button>
      <button class="primary" id="mSave">Save</button>
    </div>
  </div>
</div>

<script>
const SEED = [{"id": "001", "title": "[OpenClaw] Connect mobile device via OpenClaw node", "source": "openclaw-tasks.md", "line": 9, "column": "Backlog", "category": "Mobile", "priority": "Medium", "note": "priority=Medium"}, {"id": "002", "title": "[OpenClaw] Set up Gemini CLI re-auth cron job", "source": "openclaw-tasks.md", "line": 10, "column": "To Do", "category": "Infra/CI", "priority": "Medium", "note": "priority=Medium"}, {"id": "003", "title": "[OpenClaw] Install and configure all eligible skills", "source": "openclaw-tasks.md", "line": 11, "column": "To Do", "category": "Agent/Tooling", "priority": "Medium", "note": "priority=Medium"}, {"id": "004", "title": "[OpenClaw] Configure all plugins correctly", "source": "openclaw-tasks.md", "line": 12, "column": "To Do", "category": "Agent/Tooling", "priority": "Medium", "note": "priority=Medium"}, {"id": "005", "title": "[OpenClaw] Set up ACP tools", "source": "openclaw-tasks.md", "line": 13, "column": "To Do", "category": "Agent/Tooling", "priority": "Medium", "note": "priority=Medium"}, {"id": "006", "title": "[OpenClaw] Security audit & harden Telegram group policy", "source": "openclaw-tasks.md", "line": 14, "column": "Backlog", "category": "Agent/Tooling", "priority": "Medium", "note": "priority=Medium"}, {"id": "007", "title": "[OpenClaw step] Install openclaw on mobile/remote device", "source": "openclaw-tasks.md", "line": 24, "column": "Backlog", "category": "Mobile", "priority": "Medium", "note": ""}, {"id": "008", "title": "[OpenClaw step] Configure node to point at gateway: `wss://legitk1ng.tailb79f25.ts.net`", "source": "openclaw-tasks.md", "line": 25, "column": "To Do", "category": "Agent/Tooling", "priority": "Medium", "note": ""}, {"id": "009", "title": "[OpenClaw step] Authenticate with gateway token", "source": "openclaw-tasks.md", "line": 26, "column": "Backlog", "category": "Agent/Tooling", "priority": "Medium", "note": ""}, {"id": "010", "title": "[OpenClaw step] Verify node appears in `openclaw status --all`", "source": "openclaw-tasks.md", "line": 27, "column": "Backlog", "category": "Agent/Tooling", "priority": "Medium", "note": ""}, {"id": "011", "title": "[OpenClaw step] Create bootstrap file for `main` agent on mobile node", "source": "openclaw-tasks.md", "line": 28, "column": "Backlog", "category": "Mobile", "priority": "Medium", "note": ""}, {"id": "012", "title": "[OpenClaw step] Run initial re-auth: `openclaw models auth login --provider google-gemini-cli`", "source": "openclaw-tasks.md", "line": 42, "column": "Backlog", "category": "Agent/Tooling", "priority": "Medium", "note": ""}, {"id": "013", "title": "[OpenClaw step] Create Windows Scheduled Task or openclaw cron to run refresh before expiry", "source": "openclaw-tasks.md", "line": 43, "column": "Backlog", "category": "Infra/CI", "priority": "Medium", "note": ""}, {"id": "014", "title": "[OpenClaw step] Test that token refresh runs silently without blocking agent", "source": "openclaw-tasks.md", "line": 44, "column": "Backlog", "category": "Testing/QA", "priority": "Medium", "note": ""}, {"id": "015", "title": "[OpenClaw step] Install `jq` and `rg` (ripgrep) for session-logs skill", "source": "openclaw-tasks.md", "line": 54, "column": "Backlog", "category": "Agent/Tooling", "priority": "Medium", "note": ""}, {"id": "016", "title": "[OpenClaw step] Install `gh` CLI for github/gh-issues skills", "source": "openclaw-tasks.md", "line": 55, "column": "Backlog", "category": "Agent/Tooling", "priority": "Medium", "note": ""}, {"id": "017", "title": "[OpenClaw step] Install `ffmpeg` for video-frames skill", "source": "openclaw-tasks.md", "line": 56, "column": "Backlog", "category": "Agent/Tooling", "priority": "Medium", "note": ""}, {"id": "018", "title": "[OpenClaw step] Configure `TRELLO_API_KEY` + `TRELLO_TOKEN` env vars for trello skill", "source": "openclaw-tasks.md", "line": 57, "column": "To Do", "category": "Backend/Data", "priority": "Medium", "note": ""}, {"id": "019", "title": "[OpenClaw step] Configure `ELEVENLABS_API_KEY` for sag skill", "source": "openclaw-tasks.md", "line": 58, "column": "To Do", "category": "Backend/Data", "priority": "Medium", "note": ""}, {"id": "020", "title": "[OpenClaw step] Configure sherpa-onnx runtime + model dirs for TTS", "source": "openclaw-tasks.md", "line": 59, "column": "To Do", "category": "Agent/Tooling", "priority": "Medium", "note": ""}, {"id": "021", "title": "[OpenClaw step] Enable coding-agent skill (requires `@anthropic-ai/claude-code`)", "source": "openclaw-tasks.md", "line": 60, "column": "Backlog", "category": "Frontend/UI", "priority": "Medium", "note": ""}, {"id": "022", "title": "[OpenClaw step] Re-enable any skills incorrectly auto-disabled by doctor --fix", "source": "openclaw-tasks.md", "line": 61, "column": "Backlog", "category": "Docs", "priority": "Medium", "note": ""}, {"id": "023", "title": "[OpenClaw step] Audit disabled plugins list", "source": "openclaw-tasks.md", "line": 71, "column": "Backlog", "category": "Agent/Tooling", "priority": "Medium", "note": ""}, {"id": "024", "title": "[OpenClaw step] Enable plugins relevant to Windows environment", "source": "openclaw-tasks.md", "line": 72, "column": "Backlog", "category": "Agent/Tooling", "priority": "Medium", "note": ""}, {"id": "025", "title": "[OpenClaw step] Configure any needing API keys", "source": "openclaw-tasks.md", "line": 73, "column": "To Do", "category": "Backend/Data", "priority": "Medium", "note": ""}, {"id": "026", "title": "[OpenClaw step] Review full ACP tool catalog: `openclaw tools list`", "source": "openclaw-tasks.md", "line": 85, "column": "Backlog", "category": "Agent/Tooling", "priority": "Medium", "note": ""}, {"id": "027", "title": "[OpenClaw step] Add relevant tools to `agents.list[main].tools.alsoAllow`", "source": "openclaw-tasks.md", "line": 86, "column": "Backlog", "category": "Agent/Tooling", "priority": "Low", "note": ""}, {"id": "028", "title": "[OpenClaw step] Test tool access from agent session", "source": "openclaw-tasks.md", "line": 87, "column": "Backlog", "category": "Testing/QA", "priority": "Medium", "note": ""}, {"id": "029", "title": "[OpenClaw step] Set `channels.telegram.groupPolicy` to `\"allowlist\"`", "source": "openclaw-tasks.md", "line": 97, "column": "Backlog", "category": "Agent/Tooling", "priority": "Low", "note": ""}, {"id": "030", "title": "[OpenClaw step] Add known group IDs to `channels.telegram.groupAllowFrom`", "source": "openclaw-tasks.md", "line": 98, "column": "Backlog", "category": "Agent/Tooling", "priority": "Low", "note": ""}, {"id": "031", "title": "[OpenClaw step] Run `openclaw security audit --deep`", "source": "openclaw-tasks.md", "line": 99, "column": "Backlog", "category": "Agent/Tooling", "priority": "Medium", "note": ""}, {"id": "032", "title": "[OpenClaw step] Review and resolve any audit findings", "source": "openclaw-tasks.md", "line": 100, "column": "Backlog", "category": "Agent/Tooling", "priority": "Medium", "note": ""}, {"id": "033", "title": "It should become the user's 'relationship command center'.", "source": "docs\\horizon_prm_architecture_review.md", "line": 40, "column": "To Do", "category": "Docs", "priority": "Medium", "note": ""}, {"id": "034", "title": "It should be elevated to a core power-user feature.", "source": "docs\\horizon_prm_architecture_review.md", "line": 57, "column": "To Do", "category": "Docs", "priority": "Medium", "note": ""}, {"id": "035", "title": "Rather than simply importing contact data, the platform should implement a Social Signal Feed — a curated stream of activity from connected ", "source": "docs\\horizon_prm_architecture_review.md", "line": 148, "column": "To Do", "category": "Infra/CI", "priority": "Medium", "note": ""}, {"id": "036", "title": "| M2 | `msw` is in `dependencies` (not `devDependencies`) | Test tooling should be dev-only |", "source": "docs\\CONSTITUTION.md", "line": 1706, "column": "To Do", "category": "Testing/QA", "priority": "Medium", "note": ""}, {"id": "037", "title": "The measure of whether this document is current: a new developer should be able to set up, operate, and extend the full Horizon stack using ", "source": "docs\\CONSTITUTION.md", "line": 1736, "column": "To Do", "category": "Docs", "priority": "Medium", "note": ""}, {"id": "038", "title": "Implement the Sync Engine (`src/services/syncService.ts`) with bulk fetch and real-time listeners.", "source": "docs\\superpowers\\specs\\2026-05-10-local-first-architecture-design.md", "line": 50, "column": "To Do", "category": "Docs", "priority": "Medium", "note": ""}, {"id": "039", "title": "Based on the `ACR Phone Transcription Handoff` document, the server needs to handle a specific `multipart/form-data` structure.", "source": "KNOWLEDGE1.md", "line": 52, "column": "To Do", "category": "Infra/CI", "priority": "Medium", "note": ""}, {"id": "040", "title": "**Memory Management:** The `tiny.en` model and NeMo models should be initialized once on startup (Singleton pattern) to avoid the overhead o", "source": "KNOWLEDGE1.md", "line": 88, "column": "To Do", "category": "Docs", "priority": "Medium", "note": ""}, {"id": "041", "title": "Here are the specific fields your team needs to map:", "source": "KNOWLEDGE2.md", "line": 102, "column": "To Do", "category": "Infra/CI", "priority": "Medium", "note": ""}, {"id": "042", "title": "need to target a secondary API if ACR provides one for remote updates.", "source": "KNOWLEDGE2.md", "line": 269, "column": "To Do", "category": "Backend/Data", "priority": "Medium", "note": ""}, {"id": "043", "title": "Run backend test suite before production deployment:", "source": "docs\\reviews\\archive\\AUTOMATED_ENGINEERING_REVIEW_2026-06-21_FINAL.md", "line": 186, "column": "Backlog", "category": "Testing/QA", "priority": "Medium", "note": ""}, {"id": "044", "title": "1. Add `@axe-core/react` for automated accessibility testing", "source": "docs\\reviews\\archive\\AUTOMATED_ENGINEERING_REVIEW_2026-06-21_FINAL.md", "line": 208, "column": "Backlog", "category": "Testing/QA", "priority": "Medium", "note": ""}, {"id": "045", "title": "### Recommendation 1: Implement Comprehensive Test Suite", "source": "docs\\reviews\\archive\\AUTOMATED_ENGINEERING_REVIEW_2026-06-21_FINAL.md", "line": 271, "column": "To Do", "category": "Testing/QA", "priority": "Medium", "note": ""}, {"id": "046", "title": "CRITICAL:** Implement comprehensive test suite (minimum 70% coverage)", "source": "docs\\reviews\\archive\\AUTOMATED_ENGINEERING_REVIEW_2026-06-21_FINAL.md", "line": 351, "column": "To Do", "category": "Testing/QA", "priority": "High", "note": ""}, {"id": "047", "title": "Implement test suite for critical services:", "source": "docs\\reviews\\archive\\AUTOMATED_ENGINEERING_REVIEW_2026-06-21_FINAL.md", "line": 380, "column": "To Do", "category": "Testing/QA", "priority": "High", "note": ""}, {"id": "048", "title": "Add E2E tests for core user flows:", "source": "docs\\reviews\\archive\\AUTOMATED_ENGINEERING_REVIEW_2026-06-21_FINAL.md", "line": 384, "column": "Backlog", "category": "Testing/QA", "priority": "Low", "note": ""}, {"id": "049", "title": "Add accessibility testing with `@axe-core/react`", "source": "docs\\reviews\\archive\\AUTOMATED_ENGINEERING_REVIEW_2026-06-21_FINAL.md", "line": 391, "column": "Backlog", "category": "Testing/QA", "priority": "Medium", "note": ""}, {"id": "050", "title": "Add test coverage for:", "source": "docs\\reviews\\archive\\AUTOMATED_ENGINEERING_REVIEW_2026-06-22_FINAL.md", "line": 98, "column": "To Do", "category": "Testing/QA", "priority": "Medium", "note": ""}, {"id": "051", "title": "Add tests for `GuardianService`, `SyncService`, `ContactList`", "source": "docs\\reviews\\archive\\AUTOMATED_ENGINEERING_REVIEW_2026-06-22_FINAL.md", "line": 402, "column": "To Do", "category": "Testing/QA", "priority": "Medium", "note": ""}, {"id": "052", "title": "Add integration tests for Supabase ↔ Dexie sync", "source": "docs\\reviews\\archive\\AUTOMATED_ENGINEERING_REVIEW_2026-06-22_FINAL.md", "line": 408, "column": "Backlog", "category": "Testing/QA", "priority": "Medium", "note": ""}, {"id": "053", "title": "Supabase project reactivated (was auto-paused for low traffic)", "source": "memory", "line": 0, "column": "Done", "category": "Backend/Data", "priority": "Low", "note": "Reactivated by user 2026-08-11; nslookup resolves."}, {"id": "054", "title": "Fix Minified React #310 crash in Eclipse mobile app", "source": "memory", "line": 0, "column": "Done", "category": "Frontend/UI", "priority": "High", "note": "Confirmed fixed (mock data build)."}, {"id": "055", "title": "Wire In Progress / Blocked workflow into kanban board tooling", "source": "memory", "line": 0, "column": "In Progress", "category": "Agent/Tooling", "priority": "Medium", "note": "Building interactive board from workspace docs."}, {"id": "056", "title": "Verify backend test environment before production deploy (review gated)", "source": "docs/reviews/archive", "line": 0, "column": "Blocked", "category": "Testing/QA", "priority": "High", "note": "2026-06-22 FINAL: APPROVE after fixing backend test env."}];
const COLS = ["Backlog","To Do","In Progress","Blocked","Done"];
const COL_COLOR = {Backlog:"--backlog","To Do":"--todo","In Progress":"--prog",Blocked:"--blocked",Done:"--done"};
const LS_KEY = "horizon_kanban_v1";
const colClass = c => "c-"+c.replace(/[^A-Za-z]/g,"");
let state = load();

function load(){
  try{ const raw = localStorage.getItem(LS_KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return {cards: JSON.parse(JSON.stringify(SEED)), catOrder:null};
}
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }
function cats(){ const s=new Set(state.cards.map(c=>c.category)); SEED.forEach(c=>s.add(c.category)); return [...s].sort(); }

function render(){
  const board=document.getElementById("board");
  const q=(document.getElementById("search").value||"").toLowerCase();
  const fcat=document.getElementById("filterCat").value;
  board.innerHTML="";
  let counts={};
  COLS.forEach(col=>{
    const colCards=state.cards.filter(c=>c.column===col && (!fcat||c.category===fcat) &&
      (!q || (c.title+" "+(c.note||"")+" "+(c.source||"")).toLowerCase().includes(q)));
    counts[col]=colCards.length;
    const colEl=document.createElement("div"); colEl.className="col";
    colEl.innerHTML=`<div class="col-head"><span class="dot" style="background:var(${COL_COLOR[col]})"></span>${col}<span class="count">${colCards.length}</span></div>`;
    const body=document.createElement("div"); body.className="col-body"; body.dataset.col=col;
    colCards.forEach(c=>body.appendChild(cardEl(c)));
    body.addEventListener("dragover",e=>{e.preventDefault();body.classList.add("dragover");});
    body.addEventListener("dragleave",()=>body.classList.remove("dragover"));
    body.addEventListener("drop",e=>{e.preventDefault();body.classList.remove("dragover");
      const id=e.dataTransfer.getData("text/plain"); const c=state.cards.find(x=>x.id===id);
      if(c){c.column=col; save(); render();}});
    colEl.appendChild(body);
    const add=document.createElement("button"); add.className="add-card"; add.textContent="+ add";
    add.onclick=()=>openModal(null,col); colEl.appendChild(add);
    board.appendChild(colEl);
  });
  // stats
  const total=state.cards.length;
  document.getElementById("stats").textContent=`${total} cards · Backlog ${counts.Backlog} · To Do ${counts["To Do"]} · In Progress ${counts["In Progress"]} · Blocked ${counts.Blocked} · Done ${counts.Done}`;
  // category filter options
  const sel=document.getElementById("filterCat"); const cur=sel.value;
  sel.innerHTML='<option value="">all categories</option>'+cats().map(c=>`<option>${c}</option>`).join("");
  sel.value=cur;
  document.getElementById("catList").innerHTML=cats().map(c=>`<option value="${c}">`).join("");
}

function cardEl(c){
  const el=document.createElement("div"); el.className="card "+colClass(c.column); el.draggable=true;
  el.dataset.id=c.id;
  const note=c.note?`<div class="note">${esc(c.note)}</div>`:"";
  const src=c.source?(c.line?`${esc(c.source)}:${c.line}`:esc(c.source)):"";
  el.innerHTML=`<button class="del" title="delete">×</button>
    <p class="title">${esc(c.title)}</p>
    <div class="meta"><span class="badge cat">${esc(c.category||"General")}</span><span class="badge pri-${c.priority||"Medium"}">${c.priority||"Medium"}</span></div>
    ${note}${src?`<div class="src">${src}</div>`:""}`;
  el.addEventListener("dragstart",e=>e.dataTransfer.setData("text/plain",c.id));
  el.querySelector(".del").onclick=e=>{e.stopPropagation(); if(confirm("Delete this card?")){state.cards=state.cards.filter(x=>x.id!==c.id);save();render();}};
  el.ondblclick=()=>openModal(c);
  return el;
}
function esc(s){return String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));}

// modal
let editing=null;
function openModal(card,defaultCol){
  editing=card; const bg=document.getElementById("modalBg"); bg.classList.add("show");
  document.getElementById("mTitle").value=card?card.title:"";
  const colSel=document.getElementById("mCol"); colSel.innerHTML=COLS.map(c=>`<option>${c}</option>`).join("");
  colSel.value=card?card.column:(defaultCol||"To Do");
  document.getElementById("mCat").value=card?card.category:"General";
  document.getElementById("mPri").value=card?card.priority:"Medium";
  document.getElementById("mSrc").value=card?card.source:"";
  document.getElementById("mNote").value=card?card.note:"";
}
function closeModal(){document.getElementById("modalBg").classList.remove("show");}
document.getElementById("mCancel").onclick=closeModal;
document.getElementById("mSave").onclick=()=>{
  const title=document.getElementById("mTitle").value.trim(); if(!title)return;
  if(editing){Object.assign(editing,{title,column:document.getElementById("mCol").value,category:document.getElementById("mCat").value||"General",priority:document.getElementById("mPri").value,source:document.getElementById("mSrc").value,note:document.getElementById("mNote").value});}
  else{const id="x"+(Date.now()); state.cards.push({id,title,column:document.getElementById("mCol").value,category:document.getElementById("mCat").value||"General",priority:document.getElementById("mPri").value,source:document.getElementById("mSrc").value,note:document.getElementById("mNote").value});}
  save(); closeModal(); render();
};
document.getElementById("modalBg").addEventListener("click",e=>{if(e.target.id==="modalBg")closeModal();});
document.getElementById("addBtn").onclick=()=>openModal(null);
document.getElementById("search").oninput=render;
document.getElementById("filterCat").onchange=render;
document.getElementById("resetBtn").onclick=()=>{if(confirm("Reset board to the original seed (loses your edits)?")){state={cards:JSON.parse(JSON.stringify(SEED))};save();render();}};
render();
</script>
</body>
</html>
