# =============================================================================
# Horizon PRM — Gradle build environment configuration
# =============================================================================

# ---------------------------------------------------------------------------
# JVM daemon heap — 4 GB supports large Kotlin/R8 compilation graphs.
# HeapDumpOnOutOfMemoryError writes a .hprof on OOM for post-mortem analysis.
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# ---------------------------------------------------------------------------
# Build performance
# ---------------------------------------------------------------------------
# Run independent sub-projects in parallel (capacitor-android, capacitor-horizon, etc.)
org.gradle.parallel=true

# Cache task outputs across builds — dramatically speeds up incremental builds
org.gradle.caching=true

# Keep the Gradle daemon alive between builds (already the default; explicit for CI clarity)
org.gradle.daemon=true

# ---------------------------------------------------------------------------
# AndroidX — all Capacitor/AppCompat libs use AndroidX natively; Jetifier
# (legacy Support Library → AndroidX rewriting) is not needed and slows builds.
# ---------------------------------------------------------------------------
android.useAndroidX=true
android.enableJetifier=false

# Non-transitive R class: each module only sees its own resources, preventing
# accidental cross-module resource references and reducing compilation scope.
android.nonTransitiveRClass=true

# ---------------------------------------------------------------------------
# JDK override
# NOTE: This path is machine-specific. It is set here because the system-default
# JDK on this machine is JDK 26 (class major 70), which is currently incompatible
# with AGP 8.7.3. Remove this line once the system JAVA_HOME points to JDK 21,
# or when AGP gains JDK 26 support.
# ---------------------------------------------------------------------------
org.gradle.java.home=C:\\Program Files\\Java\\jdk-21.0.10
